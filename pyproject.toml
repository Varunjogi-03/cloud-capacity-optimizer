[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcompass"
version = "0.1.0"
description = "Risk-aware cloud commitment and capacity simulator"
requires-python = ">=3.10"
dependencies = ["pulp>=2.8", "pandas>=2.0", "numpy>=1.24"]

[project.scripts]
cloudcompass = "cloudcompass.cli:main"

[tool.setuptools]
packages = ["cloudcompass"]

